---
# ExternalSecret — pulls eks/postgres/credentials from AWS Secrets Manager
# and creates a K8s Secret called backstage-postgres-secret in the backstage namespace.
#
# Requires External Secrets Operator to be installed in the cluster:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets-operator --create-namespace
#
# The SecretStore uses IRSA — the backstage ServiceAccount must be annotated
# with the IAM role ARN that has secretsmanager:GetSecretValue permission.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: backstage
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: backstage   # references the ServiceAccount in deployment.yaml

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-postgres-secret
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backstage-postgres-secret   # the K8s Secret that gets created
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST        # key in the K8s Secret
      remoteRef:
        key: eks/postgres/credentials # Secrets Manager secret name (from your rds module)
        property: host                # field inside the JSON secret
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: eks/postgres/credentials
        property: port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: eks/postgres/credentials
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: eks/postgres/credentials
        property: password
