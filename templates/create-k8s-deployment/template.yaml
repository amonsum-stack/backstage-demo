# template.yaml
# Place this file in your backstage repo under:
#   templates/create-k8s-deployment/template.yaml

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-k8s-deployment
  title: Deploy to Kubernetes
  description: Creates a Kubernetes Deployment, Service, and HPA — deployed automatically via ArgoCD
  tags:
    - kubernetes
    - eks
    - argocd
    - gitops
    - infrastructure
spec:
  owner: team-platform
  type: service

  parameters:
    - title: Application details
      required:
        - app_name
        - namespace
        - image
        - port
        - owner
      properties:
        app_name:
          title: Application name
          type: string
          description: Name of the application (used as the Deployment and Service name)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true

        namespace:
          title: Kubernetes namespace
          type: string
          description: Namespace to deploy into (must already exist in the cluster)
          default: default
          enum:
            - default
            - weather
            - backstage

        image:
          title: Container image
          type: string
          description: Full image reference e.g. igior/my-app:latest

        port:
          title: Container port
          type: integer
          description: Port the container listens on
          default: 8080

        owner:
          title: Owner
          type: string
          description: Team or person responsible for this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Scaling
      properties:
        replicas:
          title: Initial replicas
          type: integer
          default: 2

        min_replicas:
          title: Minimum replicas (HPA)
          type: integer
          default: 1

        max_replicas:
          title: Maximum replicas (HPA)
          type: integer
          default: 5

        cpu_threshold:
          title: CPU scale-up threshold (%)
          type: integer
          default: 70

    - title: Resources
      properties:
        cpu_request:
          title: CPU request
          type: string
          default: "100m"

        memory_request:
          title: Memory request
          type: string
          default: "128Mi"

        cpu_limit:
          title: CPU limit
          type: string
          default: "500m"

        memory_limit:
          title: Memory limit
          type: string
          default: "512Mi"

    - title: Repository
      required:
        - repoName
      properties:
        repoName:
          title: GitHub repository name
          type: string
          description: Name of the new repo that will hold the Kubernetes manifests

  steps:
    # Step 1 — Render the skeleton files (manifests.yaml, catalog-info.yaml, deploy.yml)
    - id: fetch-template
      name: Fetch Kubernetes skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          app_name: ${{ parameters.app_name }}
          namespace: ${{ parameters.namespace }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          min_replicas: ${{ parameters.min_replicas }}
          max_replicas: ${{ parameters.max_replicas }}
          cpu_threshold: ${{ parameters.cpu_threshold }}
          cpu_request: ${{ parameters.cpu_request }}
          memory_request: ${{ parameters.memory_request }}
          cpu_limit: ${{ parameters.cpu_limit }}
          memory_limit: ${{ parameters.memory_limit }}
          owner: ${{ parameters.owner }}
          repo_name: ${{ parameters.repoName }}

    # Step 2 — Create the service repo and push rendered manifests into it
    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        description: Kubernetes manifests for ${{ parameters.app_name }}
        repoUrl: github.com?owner=amonsum-stack&repo=${{ parameters.repoName }}
        defaultBranch: main
        repoVisibility: private

    # Step 3 — Push the ArgoCD Application manifest into eks-gitops/apps/
    # The root ArgoCD app watches apps/ and will automatically create a child
    # Application for this service, which then syncs manifests.yaml to the cluster.
    - id: push-argocd-app
      name: Register app in GitOps repo
      action: github:repo:push
      input:
        repoUrl: github.com?owner=amonsum-stack&repo=eks-gitops
        branch: main
        commitMessage: "Add ArgoCD Application for ${{ parameters.app_name }}"
        files:
          - path: apps/${{ parameters.app_name }}.yaml
            content: |
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: ${{ parameters.app_name }}
                namespace: argocd
                finalizers:
                  - resources-finalizer.argocd.argoproj.io
              spec:
                project: default
                source:
                  repoURL: https://github.com/amonsum-stack/${{ parameters.repoName }}
                  targetRevision: main
                  path: .
                destination:
                  server: https://kubernetes.default.svc
                  namespace: ${{ parameters.namespace }}
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
                  syncOptions:
                    - CreateNamespace=false

    # Step 4 — Register the service in the Backstage catalog
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: GitHub repository
        url: ${{ steps.publish.output.remoteUrl }}
        icon: github
      - title: View in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}