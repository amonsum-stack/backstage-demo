# ArgoCD Application — generated by Backstage Software Template
# ArgoCD will watch this repo and sync manifests.yaml to the cluster automatically.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.app_name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deletes K8s resources when Application is deleted
spec:
  project: default

  source:
    repoURL: https://github.com/amonsum-stack/${{ values.repo_name }}
    targetRevision: main
    path: .   # manifests.yaml is in the repo root
    directory:
      exclude: '{catalog-info.yaml,argocd-app.yaml}'

  destination:
    server: https://kubernetes.default.svc   # in-cluster
    namespace: ${{ values.namespace }}

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual changes to match Git
    syncOptions:
      - CreateNamespace=false
