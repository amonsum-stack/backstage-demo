# Generated by Backstage Software Template
# App:   ${{ values.app_name }}
# Image: ${{ values.image }}
# Owner: ${{ values.owner }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.app_name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.app_name }}
    managed-by: backstage-scaffolder
spec:
  replicas: ${{ values.replicas }}
  selector:
    matchLabels:
      app: ${{ values.app_name }}
  template:
    metadata:
      labels:
        app: ${{ values.app_name }}
    spec:
      containers:
        - name: ${{ values.app_name }}
          image: ${{ values.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: ${{ values.port }}
              name: http

          resources:
            requests:
              cpu: "${{ values.cpu_request }}"
              memory: "${{ values.memory_request }}"
            limits:
              cpu: "${{ values.cpu_limit }}"
              memory: "${{ values.memory_limit }}"

#          readinessProbe:
#            httpGet:
#              path: /health
#              port: ${{ values.port }}
#            initialDelaySeconds: 10
#            periodSeconds: 10

#          livenessProbe:
#            httpGet:
#              path: /health
#              port: ${{ values.port }}
#            initialDelaySeconds: 30
#            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.app_name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.app_name }}
spec:
  selector:
    app: ${{ values.app_name }}
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: ${{ values.port }}
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${{ values.app_name }}
  namespace: ${{ values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${{ values.app_name }}
  minReplicas: ${{ values.min_replicas }}
  maxReplicas: ${{ values.max_replicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: ${{ values.cpu_threshold }}
